# Production-oriented stack for a VPS.
# CMS content lives in Postgres; editor uploads live in the `media` volume (not in git).
#
# Usage (on server, after clone + .env):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Persist:
#   - pgdata  → database (all admin/editor document data)
#   - media   → /app/media uploads

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nazemi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
